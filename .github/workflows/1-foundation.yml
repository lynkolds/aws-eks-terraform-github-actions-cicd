name: Deploy Foundation Infrastructure on AWS

run-name: Foundation infrastructure — ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-foundation-state
  cancel-in-progress: false

jobs:
  deploy_foundation:
    name: Terraform Foundation
    environment: dev # update with your environment name
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_WORKING_DIRECTORY: terraform/foundation
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT }}

      TF_VAR_vpc_cidr: "10.0.0.0/16"
      TF_VAR_public_subnet_az1_cidr: "10.0.0.0/24"
      TF_VAR_public_subnet_az2_cidr: "10.0.1.0/24"
      TF_VAR_private_app_subnet_az1_cidr: "10.0.2.0/24"
      TF_VAR_private_app_subnet_az2_cidr: "10.0.3.0/24"
      TF_VAR_private_db_subnet_az1_cidr: "10.0.4.0/24"
      TF_VAR_private_db_subnet_az2_cidr: "10.0.5.0/24"

      TF_VAR_database_snapshot_identifier: ${{ vars.DATABASE_SNAPSHOT_IDENTIFIER }}
      TF_VAR_database_instance_class: ${{ vars.DATABASE_INSTANCE_CLASS }}
      TF_VAR_database_instance_identifier: ${{ vars.DATABASE_INSTANCE_IDENTIFIER }}
      TF_VAR_multi_az_deployment: "true"

  
      TF_VAR_image_tag_mutability: "IMMUTABLE"
      TF_VAR_force_delete: "true"
      TF_VAR_scan_on_push: "true"
      TF_VAR_enable_lifecycle_policy: "true"
      TF_VAR_lifecycle_keep_last_n: "30"
      TF_VAR_secrets_recovery_window_days: "7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: github-foundation-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Terraform initialize
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_FOUNDATION_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform validate

      - name: Run Terraform action
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          if [ "${{ inputs.operation }}" = "plan" ]; then
            terraform plan -lock-timeout=5m
          else
            terraform "${{ inputs.operation }}" \
              -lock-timeout=5m \
              -auto-approve
          fi

      - name: Show Terraform outputs
        if: inputs.operation == 'apply'
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: terraform output