name: Populate Application Secret

run-name: Populate application secret — ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: populate-application-secret
  cancel-in-progress: false

jobs:
  populate_application_secret:
    name: Populate Secrets Manager
    environment: dev # Edit with your GitHub Environment name
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

      # Existing non-sensitive application configuration.
      APP_NAME: ${{ vars.APP_NAME }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      APP_URL: https://${{ vars.DOMAIN_NAME }}
      APP_ENV: production

      # The foundation Terraform root owns the RDS instance
      # and the Secrets Manager secret container.
      FOUNDATION_TF_WORKING_DIRECTORY: terraform/foundation

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: github-populate-secret-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Install Terraform
      #
      # Terraform is used only to read the existing foundation
      # outputs. This workflow does not run terraform apply.
      # ----------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # ----------------------------------------------------------
      # Initialize the existing foundation Terraform state
      # ----------------------------------------------------------

      - name: Initialize foundation Terraform state
        working-directory: ${{ env.FOUNDATION_TF_WORKING_DIRECTORY }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_FOUNDATION_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # ----------------------------------------------------------
      # Read the RDS and Secrets Manager identifiers
      # ----------------------------------------------------------

      - name: Read foundation outputs
        working-directory: ${{ env.FOUNDATION_TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          DATABASE_HOST="$(terraform output -raw database_address)"
          DATABASE_PORT="$(terraform output -raw database_port)"
          SECRET_ARN="$(terraform output -raw application_secret_arn)"

          if [ -z "${DATABASE_HOST}" ]; then
            echo "The RDS hostname could not be read from foundation state."
            exit 1
          fi

          if [ -z "${DATABASE_PORT}" ]; then
            echo "The RDS port could not be read from foundation state."
            exit 1
          fi

          if [ -z "${SECRET_ARN}" ]; then
            echo "The application secret ARN could not be read from foundation state."
            exit 1
          fi

          echo "DATABASE_HOST=${DATABASE_HOST}" >> "$GITHUB_ENV"
          echo "DATABASE_PORT=${DATABASE_PORT}" >> "$GITHUB_ENV"
          echo "APPLICATION_SECRET_ARN=${SECRET_ARN}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Validate GitHub Environment variables and secrets
      # ----------------------------------------------------------

      - name: Validate application configuration
        shell: bash
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APP_NAME}" ]; then
            echo "APP_NAME is not configured as a GitHub Environment variable."
            exit 1
          fi

          if [ -z "${DOMAIN_NAME}" ]; then
            echo "DOMAIN_NAME is not configured as a GitHub Environment variable."
            exit 1
          fi

          if [ -z "${DATABASE_NAME}" ]; then
            echo "DATABASE_NAME is not configured as a GitHub Environment secret."
            exit 1
          fi

          if [ -z "${DATABASE_USERNAME}" ]; then
            echo "DATABASE_USERNAME is not configured as a GitHub Environment secret."
            exit 1
          fi

          if [ -z "${DATABASE_PASSWORD}" ]; then
            echo "DATABASE_PASSWORD is not configured as a GitHub Environment secret."
            exit 1
          fi

      # ----------------------------------------------------------
      # Create the JSON value without printing credentials
      # ----------------------------------------------------------

      - name: Build application secret JSON
        shell: bash
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          set -euo pipefail

          # Restrict the temporary file to the current runner user.
          umask 077

          jq -n \
            --arg app_name "${APP_NAME}" \
            --arg app_url "${APP_URL}" \
            --arg app_env "${APP_ENV}" \
            --arg db_host "${DATABASE_HOST}" \
            --arg db_port "${DATABASE_PORT}" \
            --arg db_name "${DATABASE_NAME}" \
            --arg db_username "${DATABASE_USERNAME}" \
            --arg db_password "${DATABASE_PASSWORD}" \
            '{
              APP_NAME: $app_name,
              APP_URL: $app_url,
              APP_ENV: $app_env,
              DB_HOST: $db_host,
              DB_PORT: $db_port,
              DB_DATABASE: $db_name,
              DB_USERNAME: $db_username,
              DB_PASSWORD: $db_password
            }' > application-secret.json

      # ----------------------------------------------------------
      # Store a new secret version in AWS Secrets Manager
      # ----------------------------------------------------------

      - name: Populate application secret
        shell: bash
        run: |
          set -euo pipefail

          aws secretsmanager put-secret-value \
            --secret-id "${APPLICATION_SECRET_ARN}" \
            --secret-string "file://application-secret.json" \
            --region "${AWS_REGION}" \
            > /dev/null

          echo "A new application secret version was stored successfully."

      # ----------------------------------------------------------
      # Delete the temporary credential file from the runner
      # ----------------------------------------------------------

      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f application-secret.json

      # ----------------------------------------------------------
      # Verify that the secret has a current version
      #
      # This reads metadata only and does not print secret values.
      # ----------------------------------------------------------

      - name: Verify application secret metadata
        shell: bash
        run: |
          set -euo pipefail

          aws secretsmanager describe-secret \
            --secret-id "${APPLICATION_SECRET_ARN}" \
            --region "${AWS_REGION}" \
            --query '{
              Name: Name,
              ARN: ARN,
              VersionIdsToStages: VersionIdsToStages
            }'