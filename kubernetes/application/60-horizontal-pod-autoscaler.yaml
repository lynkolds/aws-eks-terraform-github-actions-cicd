apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${KUBERNETES_APP_NAME}
  namespace: ${APPLICATION_NAMESPACE}
  labels:
    app: ${KUBERNETES_APP_NAME}
    app.kubernetes.io/name: ${KUBERNETES_APP_NAME}
    app.kubernetes.io/part-of: ${KUBERNETES_APP_NAME}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${KUBERNETES_APP_NAME}

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

